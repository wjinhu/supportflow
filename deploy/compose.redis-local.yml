name: supportflow-local-session

services:
  redis:
    image: redis:8.2.11-alpine
    container_name: supportflow-local-redis
    user: redis
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    labels:
      io.supportflow.role: local-session-redis
      io.supportflow.workspace: ${SUPPORTFLOW_REDIS_WORKSPACE_ID:?Run scripts/setup-redis.ps1 first}
    ports:
      - 127.0.0.1:${SUPPORTFLOW_LOCAL_REDIS_PORT:-16379}:6379
    volumes:
      - type: bind
        source: ../.local/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../.local/redis/password
        target: /run/secrets/supportflow_redis_password
        read_only: true
        bind:
          create_host_path: false
      - session-data:/data
    networks: [session]
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$(cat /run/secrets/supportflow_redis_password)" redis-cli --no-auth-warning ping | grep -qx PONG'
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 20s

networks:
  session:
    name: supportflow-local-redis-network
    driver: bridge
    labels:
      io.supportflow.role: local-session-redis
      io.supportflow.workspace: ${SUPPORTFLOW_REDIS_WORKSPACE_ID:?Run scripts/setup-redis.ps1 first}

volumes:
  session-data:
    name: supportflow-local-redis-data
    labels:
      io.supportflow.role: local-session-redis
      io.supportflow.workspace: ${SUPPORTFLOW_REDIS_WORKSPACE_ID:?Run scripts/setup-redis.ps1 first}
